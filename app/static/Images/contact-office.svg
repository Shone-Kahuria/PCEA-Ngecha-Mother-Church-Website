<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Church office contact visual</title>
  <desc id="desc">An abstract office desk and message icon visual for contact pages.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f6f2e8"/>
      <stop offset="52%" stop-color="#f8f9fd"/>
      <stop offset="100%" stop-color="#e9eefb"/>
    </linearGradient>
    <linearGradient id="desk" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1f2b66"/>
      <stop offset="100%" stop-color="#334487"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="520" fill="url(#bg)"/>
  <rect x="0" y="352" width="1200" height="168" fill="url(#desk)"/>
  <rect x="130" y="120" width="520" height="220" rx="22" fill="#ffffff" stroke="#d6deef" stroke-width="4"/>
  <path d="M130 140 L390 264 L650 140" fill="none" stroke="#c91d1d" stroke-width="10"/>
  <circle cx="860" cy="176" r="90" fill="#f2be2d" fill-opacity="0.4"/>
  <rect x="780" y="250" width="280" height="64" rx="14" fill="#ffffff" stroke="#d4dcf1" stroke-width="3"/>
  <rect x="804" y="272" width="174" height="14" rx="7" fill="#2b3773" fill-opacity="0.7"/>
  <text x="156" y="104" fill="#1d285f" font-size="38" font-family="Georgia, serif">Get In Touch</text>
  <text x="804" y="294" fill="#1f2b66" font-size="24" font-family="Verdana, sans-serif">Contact the church office</text>
</svg>
