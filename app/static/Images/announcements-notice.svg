  <rect width="1200" height="520" fill="url(#bg)"/>
  <rect x="96" y="86" width="1008" height="346" rx="20" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.22"/>
  <rect x="136" y="138" width="420" height="66" rx="12" fill="#f2be2d" fill-opacity="0.84"/>
  <rect x="136" y="228" width="930" height="22" rx="8" fill="#ffffff" fill-opacity="0.55"/>
