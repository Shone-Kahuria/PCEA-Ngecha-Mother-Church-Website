  <title id="title">Church updates visual</title>
  <desc id="desc">An abstract notice board style image for announcements.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a245a"/>
      <stop offset="70%" stop-color="#2f3f87"/>
      <stop offset="100%" stop-color="#482554"/>
