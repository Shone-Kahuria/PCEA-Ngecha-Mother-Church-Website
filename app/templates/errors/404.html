{% extends "base.html" %}

{% block title %}Not Found{% endblock %}

{% block content %}
<section class="container py-5 error-shell">
  <div class="card">
    <div class="card-body py-5">
      <p class="error-code">404</p>
      <h1 class="h3 mb-2">Page Not Found</h1>
      <p class="lead">The page you requested could not be found.</p>
      <a class="btn btn-outline-primary" href="{{ url_for('main.home') }}">Return Home</a>
    </div>
  </div>
</section>
{% endblock %}
